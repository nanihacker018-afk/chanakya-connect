name: chanakya_connect
description: A Flutter application for educational management connecting students, teachers, and administrators.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Navigation
  get: ^4.6.5
  provider: ^6.0.0
  
  # State Management
  riverpod: ^2.4.0
  
  # Networking
  dio: ^5.3.0
  http: ^1.1.0
  
  # Local Storage
  hive: ^2.2.3
  shared_preferences: ^2.2.0
  
  # Firebase (for authentication and notifications)
  firebase_core: ^2.21.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.0
  intl: ^0.18.1
  
  # Validation
  email_validator: ^2.1.17
  
  # PDF and File Handling
  pdf: ^3.10.0
  file_picker: ^6.1.0
  
  # Date and Time
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
